<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureTrack - Pure Offline GPS</title>
    <meta name="theme-color" content="#0c0c0e" />
    <link rel="manifest" href="./manifest.json" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("puretrack-theme");
          const systemPrefersLight = window.matchMedia(
            "(prefers-color-scheme: light)",
          ).matches;
          const theme = savedTheme || (systemPrefersLight ? "light" : "dark");
          document.documentElement.dataset.theme = theme;

          const savedAccent = localStorage.getItem("puretrack-accent");
          if (savedAccent) {
            document.documentElement.style.setProperty(
              "--accent-color",
              savedAccent,
            );
          }
        } catch (error) {
          // Ignore storage access failures and fall back to defaults.
        }
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="dashboard">
      <div class="app-title">
        <div class="title-copy">
          <h1>PureTrack</h1>
          <div class="subtitle">Privacy-first offline tracker</div>
        </div>
        <div class="toolbar">
          <button id="theme-toggle" class="pill-button" type="button">
            Light
          </button>
          <button id="view-toggle" class="pill-button" type="button">3D</button>
          <label class="accent-control" for="accent-picker">
            <span>Accent</span>
            <input id="accent-picker" type="color" value="#00ff66" />
          </label>
        </div>
      </div>
      <div id="status-banner" aria-live="polite"></div>
      <div class="stats-grid">
        <div class="stat-box">
          <div id="time-val" class="stat-val">00:00:00</div>
          <div class="stat-lbl">Durasi</div>
        </div>
        <div class="stat-box">
          <div id="dist-val" class="stat-val">0.00 km</div>
          <div class="stat-lbl">Jarak</div>
        </div>
        <div class="stat-box">
          <div id="pace-val" class="stat-val">--:--</div>
          <div class="stat-lbl">Pace (Min/Km)</div>
        </div>
        <div class="stat-box">
          <div id="elev-val" class="stat-val">0 m</div>
          <div class="stat-lbl">Elev Gain</div>
        </div>
      </div>
    </div>

    <div id="canvas-container">
      <div id="viewer-badge" class="viewer-badge">2D trail</div>
      <canvas id="trailCanvas"></canvas>
    </div>

    <div class="controls">
      <button id="start-btn" class="btn-start" onclick="startTracking()">
        Mulai
      </button>
      <button
        id="stop-btn"
        class="btn-stop"
        onclick="stopTracking()"
        style="display: none"
      >
        Berhenti
      </button>
      <button
        id="export-gpx-btn"
        class="btn-export btn-export-gpx"
        onclick="exportGPX()"
        style="display: none"
      >
        GPX
      </button>
      <button
        id="export-svg-btn"
        class="btn-export btn-export-svg"
        onclick="exportSVG()"
        style="display: none"
      >
        SVG
      </button>
      <button
        id="export-png-btn"
        class="btn-export btn-export-png"
        onclick="exportPNG()"
        style="display: none"
      >
        PNG
      </button>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
