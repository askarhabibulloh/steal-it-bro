<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>TOTP Client - Verification QR</title>
    <link rel="stylesheet" href="/client/style.css" />
    <!-- QR Code library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  </head>
  <body>
    <div class="container" id="setupScreen">
      <div class="card">
        <h1>🔐 TOTP Client</h1>
        <p class="subtitle">Set up your verification QR code</p>
        <form id="setupForm">
          <div class="form-group">
            <label for="userId">User ID</label>
            <input
              type="text"
              id="userId"
              placeholder="e.g. a1b2c3d4"
              required
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="totpSecret">TOTP Secret</label>
            <input
              type="text"
              id="totpSecret"
              placeholder="Paste TOTP secret from registration"
              required
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="salt">Salt</label>
            <input
              type="text"
              id="salt"
              placeholder="Paste salt from registration"
              required
              autocomplete="off"
            />
          </div>
          <button type="submit" id="setupBtn">Generate QR Code</button>
        </form>
        <p class="hint">Data disimpan di localStorage perangkat ini.</p>
      </div>
    </div>

    <div class="container" id="qrScreen" style="display: none">
      <div class="card qr-card">
        <div class="user-info">
          <span class="user-label">User ID:</span>
          <span class="user-value" id="displayUserId">-</span>
          <button class="logout-btn" id="logoutBtn" title="Reset & logout">
            ✕
          </button>
        </div>

        <div class="qr-wrapper">
          <div id="qrcode"></div>
        </div>

        <div class="timer-section">
          <div class="timer-ring" id="timerRing">
            <svg viewBox="0 0 100 100">
              <circle class="bg" cx="50" cy="50" r="45" />
              <circle
                class="progress"
                id="timerProgress"
                cx="50"
                cy="50"
                r="45"
              />
            </svg>
            <div class="timer-text" id="timerText">30</div>
          </div>
          <p class="timer-label">QR refresh in</p>
        </div>

        <div class="hash-info">
          <label>Current Hash:</label>
          <code id="currentHash">-</code>
        </div>
      </div>
    </div>

    <script src="/client/app.js"></script>
  </body>
</html>
